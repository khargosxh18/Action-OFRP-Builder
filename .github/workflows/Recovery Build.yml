name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      device_tree_url:
        description: "Select Device Tree repository"
        required: true
        type: choice
        default: https://github.com/AzzyC/ofox_device_xiaomi_peridot
        options:
          - https://github.com/AzzyC/ofox_device_xiaomi_peridot
          - https://gitlab.com/OrangeFox/device/peridot_new

      device_tree_branch:
        description: "Select Device Tree branch"
        required: true
        default: fox_14.1
        type: choice
        options:
          - fox_14.1
          - auto-dfe
          - ARMv9

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    env:
      SYNC_URL: https://gitlab.com/OrangeFox/sync.git
      MANIFEST_BRANCH: 16.0
      DEVICE_TREE_URL: ${{ inputs.device_tree_url }}
      DEVICE_TREE_BRANCH: ${{ inputs.device_tree_branch }}
      RECOVERY_URL: https://github.com/khargosxh18/android_bootable_recovery_fox
      DEVICE_PATH: device/xiaomi/peridot
      DEVICE_NAME: peridot
      MAKEFILE_NAME: twrp_peridot-ap2a-userdebug
      BUILD_TARGET: recovery
      TZ: Europe/London

    steps:

    # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      run: |
        curl -fL -O "https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh"
        sudo bash android_build_env.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Install OpenJDK
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Sync OrangeFox sources and minimal manifest
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        git clone --depth=1 ${{ env.SYNC_URL }}
        cd sync
        ./orangefox_sync.sh --branch ${{ env.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Replace bootable/recovery with custom fork
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
        rm -rf bootable/recovery
        git clone --depth=1 ${{ env.RECOVERY_URL }} bootable/recovery
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Get latest bootable/recovery commit
      id: recovery_commit
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/bootable/recovery
        RECOVERY_COMMIT=$(git rev-parse --short=7 HEAD)
        echo "RECOVERY_COMMIT=$RECOVERY_COMMIT" >> $GITHUB_OUTPUT
        echo "Latest bootable/recovery commit: $RECOVERY_COMMIT"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
        git clone --depth=1 ${{ env.DEVICE_TREE_URL }} -b ${{ env.DEVICE_TREE_BRANCH }} ./${{ env.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Get latest device tree commit
      id: devtree_commit
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/${{ env.DEVICE_PATH }}
        LATEST_COMMIT=$(git rev-parse --short=7 HEAD)
        echo "LATEST_COMMIT=$LATEST_COMMIT" >> $GITHUB_OUTPUT
        echo "Latest device tree commit: $LATEST_COMMIT"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 30

    - name: Show system resources
      run: |
        echo "CPU cores:"
        nproc
        echo
        echo "Memory:"
        free -h
        echo
        echo "Disk:"
        df -h
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Building recovery
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}

        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e

        lunch ${{ env.MAKEFILE_NAME }}

        mka adbd recoveryimage -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Show system resources post-build
      run: |
        echo "CPU cores:"
        nproc
        echo
        echo "Memory:"
        free -h
        echo
        echo "Disk:"
        df -h
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox-R*.img
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox-R*.zip
        fail_on_unmatched_files: true
        name: ${{ env.DEVICE_NAME }}-${{ env.DEVICE_TREE_BRANCH }}-${{ steps.devtree_commit.outputs.LATEST_COMMIT }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ env.MANIFEST_BRANCH }}
          Device: ${{ env.DEVICE_NAME }}
          Target: ${{ env.BUILD_TARGET }}
          Device tree branch: ${{ env.DEVICE_TREE_BRANCH }}
          Device tree commit: [${{ steps.devtree_commit.outputs.LATEST_COMMIT }}](${{ env.DEVICE_TREE_URL }}/tree/${{ steps.devtree_commit.outputs.LATEST_COMMIT }})
          bootable/recovery commit: [${{ steps.recovery_commit.outputs.RECOVERY_COMMIT }}](${{ env.RECOVERY_URL }}/tree/${{ steps.recovery_commit.outputs.RECOVERY_COMMIT }})
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
